<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>midterm151</title>
  <!-- 引入 Bootstrap 5 (最新穩定版 CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .carousel-item img {
      width: 1280px;
      height: 500px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- Carousel (輪播圖 - 4張圖片) -->
  <div id="carouselExampleIndicators" class="carousel slide mb-5" data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></button>
      <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="3"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="https://picsum.photos/1280/500?random=1" class="d-block w-100" alt="輪播圖 1">
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/1280/500?random=2" class="d-block w-100" alt="輪播圖 2">
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/1280/500?random=3" class="d-block w-100" alt="輪播圖 3">
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/1280/500?random=4" class="d-block w-100" alt="輪播圖 4">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <!-- Cards (4張圖文卡片, 排在同一水平列) -->
  <div class="container mb-5">
    <div class="row row-cols-1 row-cols-md-4 g-4">
      <div class="col">
        <div class="card h-100">
          <img src="https://picsum.photos/400/250?random=5" class="card-img-top" alt="卡片圖片 1">
          <div class="card-body">
            <h5 class="card-title">卡片標題 1</h5>
            <p class="card-text">這是第一張卡片的說明文字。</p>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card h-100">
          <img src="https://picsum.photos/400/250?random=6" class="card-img-top" alt="卡片圖片 2">
          <div class="card-body">
            <h5 class="card-title">卡片標題 2</h5>
            <p class="card-text">這是第二張卡片的說明文字。</p>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card h-100">
          <img src="https://picsum.photos/400/250?random=7" class="card-img-top" alt="卡片圖片 3">
          <div class="card-body">
            <h5 class="card-title">卡片標題 3</h5>
            <p class="card-text">這是第三張卡片的說明文字。</p>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card h-100">
          <img src="https://picsum.photos/400/250?random=8" class="card-img-top" alt="卡片圖片 4">
          <div class="card-body">
            <h5 class="card-title">卡片標題 4</h5>
            <p class="card-text">這是第四張卡片的說明文字。</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 頁尾 (水平線 + 班級學號姓名) -->
  <footer class="container text-center py-4">
    <hr class="my-4">
    <p class="text-muted">班級：[請填寫班級] | 學號：[請填寫學號] | 姓名：[請填寫姓名]</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
